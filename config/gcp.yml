---
# This file describes GCP constants used to build worker pools
# It supports one top level dictionaries:
#
# # List all the available regions and their associated availability zone
# regions:
#   <gcp-region-name>:
#     zones:
#       - <gcp-availability-zone>

regions:
  us-east1:
    zones: ["b", "c", "d"]

  us-east4:
    zones: ["a", "b", "c"]

  us-central1:
    zones: ["a", "b", "c", "f"]
