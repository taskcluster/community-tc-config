# Builds imageset.sh's container image each week, as imageset.sh does, so that
# a new release of one of its tools that breaks the build is found before
# someone needs the image.
name: imageset container
on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - imagesets/container/**
      - imagesets/imageset.sh
      - imagesets/diagnostics-README.md
      - .github/workflows/imageset-container.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg "TOOLS_WEEK=$(date +%G-%V)" -t imagesets imagesets/container
      - name: Check the tools run
        run: |
          docker run --rm imagesets sh -c 'aws --version && az version && gcloud --version && gh --version && python3 -c "import tcadmin"'
      - name: Check the scripts' syntax
        run: bash -n imagesets/imageset.sh && bash -n imagesets/container/run.sh && bash -n imagesets/container/clone.sh
      - name: Test the sign-in, and the use of local changes
        run: docker run --rm -v "$PWD:/repo" -w /repo/imagesets/container imagesets python3 -m pytest -q -p no:cacheprovider test_vpn.py test_clone.py
